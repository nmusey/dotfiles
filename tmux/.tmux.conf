unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind-key r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

unbind '"'
unbind %
bind-key s split-window -v
bind-key v split-window -h
bind-key S choose-tree -Zs

# Pane navigation (vim motions)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# resize mode with Pfx-S-direction, q or esc to exit
bind-key H resize-pane -L 5 \; switch-client -T resize
bind-key J resize-pane -D 5 \; switch-client -T resize
bind-key K resize-pane -U 5 \; switch-client -T resize
bind-key L resize-pane -R 5 \; switch-client -T resize

bind-key -T resize H resize-pane -L 5 \; switch-client -T resize
bind-key -T resize J resize-pane -D 5 \; switch-client -T resize
bind-key -T resize K resize-pane -U 5 \; switch-client -T resize
bind-key -T resize L resize-pane -R 5 \; switch-client -T resize
bind-key -T resize Escape switch-client -T root
bind-key -T resize q switch-client -T root

unbind x
unbind X
bind-key x kill-window
bind-key C-x confirm-before -p "kill session #S? (y/n)" kill-session

bind-key '?' list-keys

# Never used, only navigate windows by number
unbind n
unbind p

# []{} are awkward on a split keyboard, use letters instead
unbind '['
unbind ']'
unbind '{'
unbind '}'
bind-key y copy-mode
bind-key p paste-buffer
# swap-pane -U/-D swap with the previous/next pane by index, which in a
# side-by-side split is the pane to the left/right
bind-key a swap-pane -U
bind-key e swap-pane -D

setw -g mode-keys vi
bind-key o run-shell "tmux-scrollback"

set -g mouse on
set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm*:Tc"

set-option -g allow-rename off
set-option -g automatic-rename off
set -g base-index 1
set -g pane-base-index 1
set -g set-titles off

set -g status "on"
set -g status-justify "left"
set -g status-position top
set -g status-style "bg=default,fg=default"

set -g window-status-format "#[fg=colour8] #I "
set -g window-status-current-format "#[fg=default,bold] #I "

set -g monitor-activity on
set -g monitor-bell on
set -g window-status-activity-style "fg=colour2"
set -g window-status-bell-style "fg=colour1,bold"

set -g status-left "#{?#{==:#{client_key_table},resize},#[fg=colour3#,bold] R, #{?client_prefix,#[fg=default#,bold] ! ,#[fg=colour8] ~ }}"

set -g status-right "#[fg=colour8]#S · %H:%M"
set -g status-right-length "100"
set -g status-interval 1
set -g status-keys vi

set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour4"
set -g message-style "bg=default,fg=colour4"

set-option -g default-shell $SHELL
