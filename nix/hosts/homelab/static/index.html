<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f1117;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
      color: #f8fafc;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 3rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.25rem;
      width: 100%;
      max-width: 560px;
      padding: 0 1rem;
    }

    a.card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 2rem 1rem;
      background: #1e2330;
      border: 1px solid #2d3448;
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }

    a.card:hover {
      background: #252c3f;
      border-color: #4f6af5;
      transform: translateY(-2px);
    }

    a.card .icon {
      font-size: 2rem;
    }

    a.card .label {
      font-size: 1rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    a.card .desc {
      font-size: 0.75rem;
      color: #64748b;
    }

    footer {
      margin-top: 3rem;
      font-size: 0.75rem;
      color: #334155;
    }

    footer a {
      color: #475569;
      text-decoration: none;
    }

    footer a:hover { color: #94a3b8; }
  </style>
</head>
<body>
  <h1>🏠 Home</h1>
  <p class="subtitle">Home Server</p>

  <div class="grid">
    <a class="card" href="https://watch.musey.casa">
      <span class="icon">📺</span>
      <span class="label">Jellyfin</span>
      <span class="desc">Movies & TV</span>
    </a>
    <a class="card" href="https://media.musey.casa">
      <span class="icon">🎬</span>
      <span class="label">Seerr</span>
      <span class="desc">Media Requests</span>
    </a>
    <a class="card" href="https://music.musey.casa">
      <span class="icon">🎵</span>
      <span class="label">Navidrome</span>
      <span class="desc">Music</span>
    </a>
    <a class="card" href="https://books.musey.casa">
      <span class="icon">🎧</span>
      <span class="label">Audiobookshelf</span>
      <span class="desc">Audiobooks & Podcasts</span>
    </a>
    <a class="card" href="https://photos.musey.casa">
      <span class="icon">📷</span>
      <span class="label">Photos</span>
      <span class="desc">Immich</span>
    </a>
    <a class="card" href="https://docs.musey.casa">
      <span class="icon">📄</span>
      <span class="label">Documents</span>
      <span class="desc">Paperless</span>
    </a>
    <a class="card" href="https://rss.musey.casa">
      <span class="icon">📰</span>
      <span class="label">News</span>
      <span class="desc">Miniflux</span>
    </a>
    <a class="card" href="https://read.musey.casa">
      <span class="icon">🔖</span>
      <span class="label">Read Later</span>
      <span class="desc">Readeck</span>
    </a>
    <a class="card" href="https://search.musey.casa">
      <span class="icon">🔎</span>
      <span class="label">Search</span>
      <span class="desc">SearXNG</span>
    </a>
    <a class="card" href="https://ha.musey.casa">
      <span class="icon">🏡</span>
      <span class="label">Home Assistant</span>
      <span class="desc">Automation</span>
    </a>
  </div>
</body>
</html>
